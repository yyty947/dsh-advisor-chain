# dsh-advisor-chain bundle layer: register the plugin as one bundle row.
# Layer semantics: a YAML array of row verbs; `insert` adds plugin rows to the
# composed config. A row's `id` must be unique within the layer stack; `name`
# resolves the plugin module through the installed package (package.json#main).
#
# The embedded config ships an EMPTY chain on purpose: every installation picks
# its own providers in 设置 → Second Opinion (models are configured in DSH's
# own 设置 → 模型 page). Versions <= 0.3.9 shipped the maintainer's personal
# chain here, which pointed at provider ids that do not exist elsewhere.
- insert:
    - id: dsh-advisor-chain
      name: dsh-advisor-chain
      config:
        enabled: true
        mode: auto
        contextMode: inherited
        chain: []
        followup:
          maxRounds: 8
        trigger:
          repeatThreshold: 3
        limits:
          defaultTimeoutMs: 300000
          transcriptMaxChars: 120000
          perEntryMaxChars: 4000
